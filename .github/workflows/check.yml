name: Comprobar Estadísticas v3
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar estructura y JavaScript
        run: python tools/validate.py
      - name: Instalar navegador de pruebas
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probar móvil, tema, actas, mapas y navegación
        run: python tests/smoke.py
