<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="Estadísticas compartidas de Buen Consejo">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Estadísticas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('estadisticas_theme')||'light'}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="team" aria-label="Ir al resumen">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><b>Estadísticas</b><small>Buen Consejo · 26/27</small></span>
      </button>
      <div class="top-actions">
        <button class="status" id="syncStatus" data-action="open-sync"><span></span><b>Solo local</b></button>
        <button class="top-action-button" data-action="install" title="Instalar app" aria-label="Instalar app"><b>⇩</b><span>Instalar</span></button>
        <button class="top-action-button" data-action="toggle-theme" title="Cambiar tema" aria-label="Cambiar tema"><b>◐</b><span>Tema</span></button>
        <button class="top-action-button" data-action="open-settings" title="Ajustes" aria-label="Ajustes"><b>•••</b><span>Ajustes</span></button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Secciones">
      <nav>
        <button data-go="live"><em>01</em><span><b>Directo</b><small>Apuntar el partido</small></span></button>
        <button data-go="team" aria-current="page"><em>02</em><span><b>Equipo</b><small>Temporada</small></span></button>
        <button data-go="players"><em>03</em><span><b>Jugadoras</b><small>Rendimiento</small></span></button>
        <button data-go="games"><em>04</em><span><b>Partidos</b><small>Actas y mapas</small></span></button>
      </nav>
      <footer><b id="roleLabel">SIN CONECTAR</b><small>v2 · datos honestos</small></footer>
    </aside>

    <main id="main" tabindex="-1"><div id="view"></div></main>

    <nav class="bottom-nav" aria-label="Secciones">
      <button data-go="live"><span>●</span><b>Directo</b></button>
      <button data-go="team" aria-current="page"><span>▦</span><b>Equipo</b></button>
      <button data-go="players"><span>♙</span><b>Jugadoras</b></button>
      <button data-go="games"><span>□</span><b>Partidos</b></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden aria-hidden="true"><div class="modal-backdrop" data-action="close-modal"></div><section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div><button class="icon-button" data-action="close-modal" aria-label="Cerrar">×</button></header><div id="modalBody"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept=".xlsx" multiple hidden>

  <script src="assets/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
